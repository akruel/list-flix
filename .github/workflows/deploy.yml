name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Run database migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_HOST=$(echo "$SUPABASE_DB_URL" | awk -F'[@:]' '{print $4}')
          DB_IP=$(getent ahosts "$DB_HOST" | awk '!/:/{print $1; exit}')
          if [ -z "$DB_IP" ]; then
            echo "Failed to resolve IPv4 for $DB_HOST"
            exit 1
          fi
          DB_URL_IPV4="${SUPABASE_DB_URL/$DB_HOST/$DB_IP}"
          echo "Resolved $DB_HOST to $DB_IP"
          supabase db push --db-url "$DB_URL_IPV4"

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body -X POST "$VERCEL_DEPLOY_HOOK_URL"
