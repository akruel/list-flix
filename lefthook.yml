pre-commit:
  commands:
    format:
      run: pnpm run format:check
    lint:
      run: pnpm run lint
    typecheck:
      run: pnpm run typecheck
    knip:
      run: pnpm run knip

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit "$1"

pre-push:
  commands:
    build:
      run: pnpm run build
    test-unit-ui:
      run: pnpm run test
