pre-commit:
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint
    typecheck:
      run: npm run typecheck
    knip:
      run: npm run knip

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit "$1"

pre-push:
  commands:
    build:
      run: npm run build
    test-unit-ui:
      run: npm run test
